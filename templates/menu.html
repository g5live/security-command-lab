<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>g5live Lab Setup</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .menu-container {
            background-color: #1e1e1e;
            padding: 3rem;
            border-radius: 8px;
            border-top: 5px solid #FF8C00;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .header { text-align: center; margin-bottom: 2.5rem; }
        .header h1 { margin: 0; color: #f0f0f0; }
        .header span { color: #9b59b6; font-weight: bold; letter-spacing: 1px; }

        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; color: #C0C0C0; }
        select {
            width: 100%;
            padding: 12px;
            background-color: #2d2d2d;
            color: white;
            border: 1px solid #333;
            border-radius: 4px;
            font-size: 1rem;
            outline: none;
        }
        select:focus { border-color: #FF8C00; }

        .launch-btn {
            width: 100%;
            background-color: #28a745;
            color: #121212;
            border: none;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: background-color 0.3s;
        }
        .launch-btn:hover { background-color: #ffffff; }
    </style>
</head>
<body>
    <div class="menu-container">
        <div class="header">
            <h1>Lab Configuration</h1>
            <span>g5live // Security Environment</span>
        </div>

        <form action="/start" method="POST">

            <div class="form-group">
                <label>Target Modules (Select one or more)</label>
                <div style="background-color: #2d2d2d; padding: 15px; border-radius: 4px; border: 1px solid #333;">
                    <label style="display: flex; align-items: center; gap: 10px; color: white; cursor: pointer; margin-bottom: 10px; font-weight: normal;">
                        <input type="checkbox" name="modules" value="security_plus" checked> Security+
                    </label>
                    <label style="display: flex; align-items: center; gap: 10px; color: white; cursor: pointer; margin-bottom: 10px; font-weight: normal;">
                        <input type="checkbox" name="modules" value="offensive_security"> Offensive Security (OSCP)
                    </label>
                    <label style="display: flex; align-items: center; gap: 10px; color: white; cursor: pointer; margin-bottom: 10px; font-weight: normal;">
                        <input type="checkbox" name="modules" value="pentesting"> Pentesting (CREST)
                    </label>
                    <label style="display: flex; align-items: center; gap: 10px; color: white; cursor: pointer; margin-bottom: 0; font-weight: normal;">
                        <input type="checkbox" name="modules" value="ethical_hacker"> Ethical Hacker
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="difficulty">Knowledge Tier</label>
                <select name="difficulty" id="difficulty" required>
                    <option value="basic">Foundational (Security+ Baseline)</option>
                    <option value="standard">Standard (Intermediate)</option>
                    <option value="professional" disabled>Professional (CREST/OSCP Prep) — Planned</option>
                </select>
            </div>

            <div class="form-group">
                <label for="time_limit">Session Timer</label>
                <select name="time_limit" id="time_limit" required>
                    <option value="300">5 Minutes</option>
                    <option value="600">10 Minutes (Sprint)</option>
                    <option value="1200">20 Minutes</option>
                    <option value="1800">30 Minutes</option>
                    <option value="3600">1 Hour (Standard Block)</option>
                    <option value="5400">1 Hour 30 Minutes</option>
                    <option value="7200">2 Hours (Deep Focus)</option>
                </select>
            </div>

            <button type="submit" class="launch-btn">Initialize Lab Session</button>
        </form>
    </div>
</body>
</html>
